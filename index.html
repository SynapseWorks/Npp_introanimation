<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newcastle Port Pulse — Intro Animation</title>
  <style>
    :root {
      --black: #000000;
      --ink: #050402;
      --gold: #e6d6b4;
      --gold-bright: #fff2cc;
      --amber: #e29625;
      --glow: rgba(226, 150, 37, 0.44);
      --cycle: 9.6s;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--black);
      font-family: var(--font);
      color: var(--gold);
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 44%, rgba(226,150,37,0.14), transparent 24%),
        radial-gradient(circle at 50% 50%, rgba(230,214,180,0.07), transparent 42%),
        linear-gradient(180deg, #000 0%, #050402 48%, #000 100%);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .stage::before {
      background:
        linear-gradient(to right, rgba(230,214,180,0.033) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(230,214,180,0.024) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(circle at center, black 0%, black 28%, transparent 72%);
      opacity: 0.62;
      z-index: 0;
    }

    .stage::after {
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.022),
          rgba(255,255,255,0.022) 1px,
          transparent 1px,
          transparent 6px
        ),
        radial-gradient(circle at center, transparent 0 45%, rgba(0,0,0,0.75) 82%, #000 100%);
      opacity: 0.42;
      mix-blend-mode: screen;
      z-index: 9;
    }

    .corner-noise {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 8% 10%, rgba(230,214,180,.26) 0 1px, transparent 1.5px),
        radial-gradient(circle at 82% 18%, rgba(226,150,37,.2) 0 1px, transparent 1.5px),
        radial-gradient(circle at 72% 88%, rgba(230,214,180,.18) 0 1px, transparent 1.5px);
      background-size: 180px 170px, 220px 210px, 260px 240px;
      opacity: .22;
      animation: noiseFlicker 1.7s steps(2) infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes noiseFlicker {
      0%, 100% { opacity: .16; }
      50% { opacity: .28; }
    }

    .intro {
      position: relative;
      width: min(1180px, 94vw);
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      z-index: 2;
    }

    .halo {
      position: absolute;
      width: min(58vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,242,204,0.14), rgba(226,150,37,0.06) 28%, transparent 64%);
      filter: blur(8px);
      opacity: 0;
      animation: haloPulse var(--cycle) ease-in-out infinite;
      z-index: 1;
    }

    @keyframes haloPulse {
      0%, 8%, 92%, 100% { opacity: 0; transform: scale(0.9); }
      28%, 72% { opacity: 1; transform: scale(1); }
    }

    .pulse-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 3;
      filter: drop-shadow(0 0 11px rgba(226,150,37,0.44));
    }

    .pulse-base,
    .pulse-draw {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pulse-base {
      stroke: rgba(230,214,180,0.11);
      stroke-width: 2;
      opacity: 0;
      animation: baseGhost var(--cycle) ease-in-out infinite;
    }

    .pulse-draw {
      stroke: url(#pulseGradient);
      stroke-width: 2.75;
      stroke-dasharray: 2400;
      stroke-dashoffset: 2400;
      animation: drawPulse var(--cycle) cubic-bezier(.45,.02,.22,1) infinite;
    }

    .pulse-dot {
      fill: var(--gold-bright);
      filter: drop-shadow(0 0 16px var(--amber));
      offset-path: path("M -80 390 L 90 390 L 118 390 L 128 372 L 140 416 L 154 390 L 180 390 L 192 378 L 205 390 L 238 390 L 252 371 L 268 428 L 286 390 L 306 390 L 318 381 L 333 399 L 352 390 L 372 390 L 388 354 L 410 258 L 438 390 L 488 390 L 535 388 L 580 388 L 625 388 L 670 388 L 715 388 L 760 388 L 805 388 L 850 388 L 895 388 L 940 388 L 970 388 L 981 371 L 994 408 L 1008 388 L 1030 388 L 1050 388 L 1063 377 L 1077 399 L 1094 388 L 1180 388");
      animation: moveDot var(--cycle) cubic-bezier(.45,.02,.22,1) infinite;
    }

    @keyframes baseGhost {
      0%, 5%, 90%, 100% { opacity: 0; }
      18%, 74% { opacity: 1; }
    }

    @keyframes drawPulse {
      0% { stroke-dashoffset: 2400; opacity: 0; }
      6% { opacity: 1; }
      54% { stroke-dashoffset: 0; opacity: 1; }
      76% { stroke-dashoffset: 0; opacity: 0.48; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @keyframes moveDot {
      0% { offset-distance: 0%; opacity: 0; transform: scale(.7); }
      7% { opacity: 1; }
      54% { offset-distance: 100%; opacity: 1; transform: scale(1); }
      62%, 100% { offset-distance: 100%; opacity: 0; transform: scale(.7); }
    }

    .logo-lockup {
      position: relative;
      z-index: 4;
      width: min(600px, 60vw);
      display: grid;
      justify-items: center;
      transform: translateY(8px);
      animation: lockupHold var(--cycle) ease-in-out infinite;
    }

    @keyframes lockupHold {
      0%, 12%, 100% {
        opacity: 0;
        transform: translateY(20px) scale(.985);
        filter: drop-shadow(0 0 0 transparent);
      }

      25%, 82% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 24px rgba(226,150,37,.28));
      }

      90% {
        opacity: 0;
        transform: translateY(-10px) scale(.99);
        filter: drop-shadow(0 0 0 transparent);
      }
    }

    .logo-wrap {
      position: relative;
      width: min(370px, 39vw);
      display: grid;
      place-items: center;
      margin-bottom: clamp(16px, 1.8vw, 26px);
    }

    .logo-glow {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,242,204,0.24), rgba(226,150,37,0.13) 42%, transparent 72%);
      filter: blur(22px);
      opacity: 0;
      animation: logoGlow var(--cycle) ease-in-out infinite;
    }

    @keyframes logoGlow {
      0%, 18%, 100% { opacity: 0; transform: scale(.82); }
      40%, 74% { opacity: 1; transform: scale(1); }
    }

    .main-logo {
      position: relative;
      width: 100%;
      height: auto;
      object-fit: contain;
      opacity: 0;
      filter:
        drop-shadow(0 0 10px rgba(226,150,37,0.32))
        drop-shadow(0 0 24px rgba(226,150,37,0.22));
      transform: scale(.94) translateY(10px);
      animation: logoReveal var(--cycle) ease-in-out infinite;
    }

    @keyframes logoReveal {
      0%, 14% { opacity: 0; transform: scale(.92) translateY(14px); }
      28% { opacity: 1; }
      42%, 78% { opacity: 1; transform: scale(1) translateY(0); }
      92%, 100% { opacity: 0; transform: scale(1.03) translateY(-6px); }
    }

    .signal-rings {
      position: absolute;
      top: -4%;
      left: 50%;
      width: min(560px, 62vw);
      height: min(330px, 34vw);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: -1;
    }

    .ring {
      position: absolute;
      border: 3px solid rgba(230,214,180,0.68);
      border-radius: 50%;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(226,150,37,0.34));
      animation: ringPulse var(--cycle) ease-in-out infinite;
    }

    .ring-1 { inset: 24% 13%; }
    .ring-2 { inset: 12% 4%; animation-delay: .12s; }
    .ring-3 { inset: 0% -6%; animation-delay: .24s; }

    @keyframes ringPulse {
      0%, 42% { opacity: 0; transform: scale(.84); }
      54% { opacity: .86; }
      72% { opacity: .4; }
      100% { opacity: 0; transform: scale(1.08); }
    }

    .title {
      text-align: center;
      text-transform: uppercase;
      font-weight: 950;
      line-height: .9;
      letter-spacing: .035em;
      font-size: clamp(2.05rem, 5.75vw, 4.8rem);
      color: transparent;
      -webkit-text-stroke: 1.4px var(--gold);
      text-shadow: 0 0 18px rgba(226,150,37,.28);
      opacity: 0;
      animation: titleReveal var(--cycle) ease-in-out infinite;
    }

    @keyframes titleReveal {
      0%, 36% { opacity: 0; transform: translateY(10px); }
      50%, 78% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-4px); }
    }

    .divider {
      width: 100%;
      height: 2px;
      margin: clamp(14px, 1.8vw, 21px) 0 clamp(10px, 1.2vw, 15px);
      background: linear-gradient(90deg, transparent, rgba(230,214,180,.45), var(--gold-bright), rgba(230,214,180,.45), transparent);
      transform-origin: center;
      transform: scaleX(0);
      filter: drop-shadow(0 0 10px rgba(226,150,37,.45));
      animation: dividerReveal var(--cycle) ease-in-out infinite;
    }

    @keyframes dividerReveal {
      0%, 45% { opacity: 0; transform: scaleX(0); }
      56%, 78% { opacity: 1; transform: scaleX(1); }
      100% { opacity: 0; transform: scaleX(.82); }
    }

    .tagline {
      text-align: center;
      text-transform: uppercase;
      font-size: clamp(.76rem, 1.55vw, 1.18rem);
      letter-spacing: .16em;
      font-weight: 850;
      color: var(--gold);
      opacity: 0;
      text-shadow: 0 0 12px rgba(226,150,37,.28);
      animation: taglineReveal var(--cycle) ease-in-out infinite;
    }

    @keyframes taglineReveal {
      0%, 51% { opacity: 0; transform: translateY(8px); }
      62%, 78% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-4px); }
    }

    .glint {
      position: absolute;
      width: 28vw;
      height: 150vh;
      top: -25vh;
      left: -45vw;
      transform: rotate(20deg);
      background: linear-gradient(90deg, transparent, rgba(255,242,204,.085), transparent);
      filter: blur(5px);
      pointer-events: none;
      z-index: 6;
      animation: glint var(--cycle) ease-in-out infinite;
    }

    @keyframes glint {
      0%, 54% { left: -45vw; opacity: 0; }
      64% { opacity: 1; }
      78% { left: 120vw; opacity: 0; }
      100% { left: 120vw; opacity: 0; }
    }

    @media (max-width: 700px) {
      .intro {
        width: 96vw;
        aspect-ratio: 9 / 14;
      }

      .pulse-svg {
        transform: scale(1.22);
        transform-origin: center;
        opacity: .82;
      }

      .logo-lockup {
        width: 84vw;
      }

      .logo-wrap {
        width: min(300px, 62vw);
      }

      .signal-rings {
        width: 92vw;
        height: 48vw;
      }

      .title {
        -webkit-text-stroke: 1px var(--gold);
      }
    }

    @media (max-height: 620px) and (min-width: 701px) {
      .intro { width: min(980px, 94vw); }
      .logo-lockup { width: min(500px, 54vw); }
      .logo-wrap { width: min(240px, 26vw); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .logo-lockup,
      .title,
      .tagline,
      .divider,
      .pulse-base,
      .pulse-draw,
      .halo,
      .main-logo,
      .logo-glow {
        opacity: 1;
        transform: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Newcastle Port Pulse animated intro">
    <div class="corner-noise" aria-hidden="true"></div>

    <section class="intro">
      <div class="halo" aria-hidden="true"></div>

      <svg class="pulse-svg" viewBox="0 0 1100 620" aria-hidden="true">
        <defs>
          <linearGradient id="pulseGradient" x1="0%" x2="100%" y1="0%" y2="0%">
            <stop offset="0%" stop-color="rgba(230,214,180,0)" />
            <stop offset="16%" stop-color="#e29625" />
            <stop offset="45%" stop-color="#fff2cc" />
            <stop offset="78%" stop-color="#e29625" />
            <stop offset="100%" stop-color="rgba(230,214,180,0)" />
          </linearGradient>
        </defs>

        <path class="pulse-base" d="M -80 390 L 90 390 L 118 390 L 128 372 L 140 416 L 154 390 L 180 390 L 192 378 L 205 390 L 238 390 L 252 371 L 268 428 L 286 390 L 306 390 L 318 381 L 333 399 L 352 390 L 372 390 L 388 354 L 410 258 L 438 390 L 488 390 L 535 388 L 580 388 L 625 388 L 670 388 L 715 388 L 760 388 L 805 388 L 850 388 L 895 388 L 940 388 L 970 388 L 981 371 L 994 408 L 1008 388 L 1030 388 L 1050 388 L 1063 377 L 1077 399 L 1094 388 L 1180 388" />
        <path class="pulse-draw" d="M -80 390 L 90 390 L 118 390 L 128 372 L 140 416 L 154 390 L 180 390 L 192 378 L 205 390 L 238 390 L 252 371 L 268 428 L 286 390 L 306 390 L 318 381 L 333 399 L 352 390 L 372 390 L 388 354 L 410 258 L 438 390 L 488 390 L 535 388 L 580 388 L 625 388 L 670 388 L 715 388 L 760 388 L 805 388 L 850 388 L 895 388 L 940 388 L 970 388 L 981 371 L 994 408 L 1008 388 L 1030 388 L 1050 388 L 1063 377 L 1077 399 L 1094 388 L 1180 388" />
        <circle class="pulse-dot" cx="0" cy="0" r="6" />
      </svg>

      <div class="logo-lockup">
        <div class="logo-wrap">
          <div class="logo-glow"></div>
          <img src="assets/Logo.png" alt="Newcastle Port Pulse Logo" class="main-logo" />
        </div>

        <div class="signal-rings" aria-hidden="true">
          <span class="ring ring-1"></span>
          <span class="ring ring-2"></span>
          <span class="ring ring-3"></span>
        </div>

        <h1 class="title">Newcastle<br />Port Pulse</h1>
        <div class="divider"></div>
        <p class="tagline">Your Signal on the Lakeshore.</p>
      </div>
    </section>

    <div class="glint" aria-hidden="true"></div>
  </main>
</body>
</html>
